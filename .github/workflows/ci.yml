name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Testes H2 + Spock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Testes
        run: ./mvnw -B test
      - name: Empacotar
        run: ./mvnw -B -DskipTests package

  integration:
    name: PostgreSQL + Garage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: photoizer
          POSTGRES_USER: photoizer
          POSTGRES_PASSWORD: photoizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U photoizer -d photoizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Subir Garage
        run: |
          docker run -d --name garage -p 3900:3900 \
            -e GARAGE_CONFIG_FILE=/etc/garage.toml \
            -e GARAGE_RPC_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e GARAGE_ADMIN_TOKEN=ci-admin-token \
            -e GARAGE_METRICS_TOKEN=ci-metrics-token \
            -e GARAGE_DEFAULT_ACCESS_KEY=GK00000000000000000000000000000000 \
            -e GARAGE_DEFAULT_SECRET_KEY=fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 \
            -e GARAGE_DEFAULT_BUCKET=crm-test-originais \
            -v "$PWD/docker/garage/garage.ci.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
      - name: Aguardar Garage
        run: |
          for i in $(seq 1 30); do
            if docker exec garage /garage stats -a > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs garage
          exit 1
      - name: Validar schema, migrações e storage
        run: ./mvnw -B verify
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/photoizer
          POSTGRES_TEST_USERNAME: photoizer
          POSTGRES_TEST_PASSWORD: photoizer
          S3_TEST_ENDPOINT: http://localhost:3900
          S3_TEST_ACCESS_KEY: GK00000000000000000000000000000000
          S3_TEST_SECRET_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          S3_TEST_BUCKET: crm-test-originais

  image:
    name: Publicar imagem no GHCR
    needs: [test, integration]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ranny-amaral-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy no Coolify
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ]; then
            curl -fsS -X POST "$COOLIFY_WEBHOOK"
          fi
