name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes rápidos (H2 + Spock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Executar testes
        run: ./mvnw -B test

      - name: Empacotar
        run: ./mvnw -B -DskipTests package

  postgres:
    name: Schema PostgreSQL + MinIO (Flyway + storage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: photoizer
          POSTGRES_USER: photoizer
          POSTGRES_PASSWORD: photoizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U photoizer -d photoizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Subir MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

      - name: Aguardar MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO nao respondeu" >&2
          exit 1

      - name: Validar migrações, schema e storage
        run: ./mvnw -B verify
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/photoizer
          POSTGRES_TEST_USERNAME: photoizer
          POSTGRES_TEST_PASSWORD: photoizer
          MINIO_TEST_ENDPOINT: http://localhost:9000
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin
          MINIO_TEST_BUCKET: crm-test-originais
