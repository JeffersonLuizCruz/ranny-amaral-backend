name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes rápidos (H2 + Spock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Executar testes
        run: ./mvnw -B test

      - name: Empacotar
        run: ./mvnw -B -DskipTests package

  postgres:
    name: Schema PostgreSQL (Flyway + validate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: photoizer
          POSTGRES_USER: photoizer
          POSTGRES_PASSWORD: photoizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U photoizer -d photoizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validar migrações e schema
        run: ./mvnw -B verify
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/photoizer
          POSTGRES_TEST_USERNAME: photoizer
          POSTGRES_TEST_PASSWORD: photoizer
