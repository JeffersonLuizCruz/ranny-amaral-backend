# Docker Compose do Garage para o Coolify 4.7.x (producao).
#
# Crie um recurso "Docker Compose" apontando para este arquivo (ou cole o
# conteudo na UI) e defina as variaveis GARAGE_* como secrets.
#
# Depois, no Coolify, associe o dominio https://arquivos.<dominio> ao servico
# `garage`, porta 3900. O `garage-init` roda uma vez para aplicar CORS/lifecycle.
#
# Tudo fica em bind mount no host (/srv/ranny/garage) por tres motivos:
#  - backup com restic direto no host;
#  - o backend mede o disco real em /var/lib/garage/data;
#  - configuracao (garage.toml, cors.json, lifecycle.json) versionada no host,
#    sem depender de extensoes do Compose.
#
# Preparar o host antes do deploy:
#   mkdir -p /srv/ranny/garage/{meta,data}
#   # criar /srv/ranny/garage/{garage.toml,cors.json,lifecycle.json}

services:
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: crm-originais
      RUST_LOG: garage=info
    mem_limit: 1g
    expose:
      - "3900"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ranny-garage-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ranny-garage-http.entryPoints=http"
      - "traefik.http.routers.ranny-garage-http.rule=Host(`arquivos.rannyamaralfotografia.digital`)"
      - "traefik.http.routers.ranny-garage-http.middlewares=ranny-garage-redirect"
      - "traefik.http.routers.ranny-garage-https.entryPoints=https"
      - "traefik.http.routers.ranny-garage-https.rule=Host(`arquivos.rannyamaralfotografia.digital`)"
      - "traefik.http.routers.ranny-garage-https.tls=true"
      - "traefik.http.routers.ranny-garage-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.ranny-garage.loadbalancer.server.port=3900"
    volumes:
      - /srv/ranny/garage/meta:/var/lib/garage/meta
      - /srv/ranny/garage/data:/var/lib/garage/data
      - /srv/ranny/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    image: amazon/aws-cli:2.17.0
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://garage:3900
    volumes:
      - /srv/ranny/garage/cors.json:/config/cors.json:ro
      - /srv/ranny/garage/lifecycle.json:/config/lifecycle.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3api head-bucket --bucket crm-originais 2>/dev/null; do sleep 1; done
        aws s3api put-bucket-cors --bucket crm-originais --cors-configuration file:///config/cors.json
        aws s3api put-bucket-lifecycle-configuration --bucket crm-originais --lifecycle-configuration file:///config/lifecycle.json
