# Espelho local do ambiente de desenvolvimento: PostgreSQL + Flyway + MinIO.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   ./mvnw spring-boot:run
#   docker compose -f docker-compose.dev.yml down
#
# O backend roda fora do container apontando para localhost:5432 e
# localhost:9000. Em producao, MinIO e PostgreSQL usam volumes persistentes.

services:
  postgres:
    image: postgres:16
    container_name: fotografia-dev-postgres
    environment:
      POSTGRES_DB: photoizer
      POSTGRES_USER: photoizer
      POSTGRES_PASSWORD: photoizer
    ports:
      - "5432:5432"
    volumes:
      - fotografia-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoizer -d photoizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fotografia-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fotografia-dev-minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: fotografia-dev-minio-init
    depends_on:
      - minio
    volumes:
      - ./docker/minio/cors.json:/config/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/crm-originais;
      mc anonymous set none local/crm-originais;
      mc cors set local/crm-originais /config/cors.json;
      echo 'MinIO pronto: bucket crm-originais e CORS configurados.';
      "

volumes:
  fotografia-dev-pgdata:
  fotografia-dev-minio-data:
