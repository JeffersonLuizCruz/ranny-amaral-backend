spring.application.name=fotografia
server.port=8080
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Datasource PostgreSQL (todos os ambientes, inclusive dev).
# Os defaults apontam para o Postgres local do docker-compose.dev.yml.
# Em cada ambiente sobrescreva com SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/photoizer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:photoizer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:photoizer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O schema e responsabilidade do Flyway (db/migration); o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Aplicacao
# ---------------------------------------------------------------------------
app.seed.enabled=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Remove publicações concluídas; eventos pendentes continuam no outbox.
spring.modulith.events.completion-mode=delete

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.ranny.fotografia=INFO
