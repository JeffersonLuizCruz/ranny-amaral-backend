spring.application.name=fotografia
server.port=8080
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Datasource PostgreSQL (todos os ambientes, inclusive dev).
# Os defaults apontam para o Postgres local do docker-compose.dev.yml.
# Em cada ambiente sobrescreva com SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/photoizer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:photoizer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:photoizer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O schema e responsabilidade do Flyway (db/migration); o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Aplicacao
# ---------------------------------------------------------------------------
app.seed.enabled=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.security.enabled=${APP_SECURITY_ENABLED:true}

# ---------------------------------------------------------------------------
# Autenticacao / sessao.
# ---------------------------------------------------------------------------
app.auth.access-token-minutes=${APP_AUTH_ACCESS_MINUTES:15}
app.auth.refresh-token-days=${APP_AUTH_REFRESH_DAYS:7}
app.auth.issuer=${APP_AUTH_ISSUER:http://localhost:8080}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:refresh_token}
app.auth.cookie-domain=${APP_AUTH_COOKIE_DOMAIN:}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.max-tentativas=${APP_AUTH_MAX_TENTATIVAS:5}
app.auth.bloqueio-minutos=${APP_AUTH_BLOQUEIO_MINUTOS:15}
app.auth.senha-minima=${APP_AUTH_SENHA_MINIMA:8}
app.auth.senha-maxima=${APP_AUTH_SENHA_MAXIMA:128}
app.auth.bootstrap-enabled=${APP_AUTH_BOOTSTRAP_ENABLED:false}
app.auth.bootstrap-admin-email=${APP_AUTH_BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.jwt-private-key=${APP_AUTH_JWT_PRIVATE_KEY:}
app.auth.jwt-public-key=${APP_AUTH_JWT_PUBLIC_KEY:}
app.auth.jwt-key-id=${APP_AUTH_JWT_KEY_ID:ranny-1}
app.auth.allow-ephemeral-keys=${APP_AUTH_ALLOW_EPHEMERAL_KEYS:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=readinessState,storage

# ---------------------------------------------------------------------------
# Seguranca de borda.
# O filtro roda no inicio da cadeia do Spring Security e rejeita payloads
# excessivos, headers ausentes, content-types invalidos e padroes de scanning.
# ---------------------------------------------------------------------------
app.seguranca.borda.habilitado=${APP_SEGURANCA_BORDA_HABILITADO:true}
app.seguranca.borda.max-payload-bytes=${APP_SEGURANCA_BORDA_MAX_PAYLOAD:2097152}
app.seguranca.borda.exigir-user-agent=${APP_SEGURANCA_BORDA_EXIGIR_USER_AGENT:true}
app.seguranca.borda.max-user-agent-length=${APP_SEGURANCA_BORDA_MAX_USER_AGENT:512}
app.seguranca.borda.exigir-content-type-em-mutacoes=${APP_SEGURANCA_BORDA_EXIGIR_CONTENT_TYPE:true}
app.seguranca.borda.bloquear-padroes-scanning=${APP_SEGURANCA_BORDA_BLOQUEAR_SCANNING:true}
app.seguranca.borda.ip-check-habilitado=${APP_SEGURANCA_BORDA_IP_CHECK:false}
app.seguranca.borda.confiar-em-proxy=${APP_SEGURANCA_BORDA_CONFIAR_PROXY:false}

# Processamento de derivados de galeria em background (thumb/web).
app.galeria.processamento-async=${APP_GALERIA_PROCESSAMENTO_ASYNC:true}
app.galeria.zip-max-bytes=${APP_GALERIA_ZIP_MAX_BYTES:2147483648}

# Notificacao de WhatsApp (integracao futura; adapter no-op por padrao).
app.notificacao.whatsapp.habilitado=${APP_NOTIFICACAO_WHATSAPP_HABILITADO:false}
app.notificacao.whatsapp.provedor=${APP_NOTIFICACAO_WHATSAPP_PROVEDOR:log}
app.notificacao.whatsapp.webhook-url=${APP_NOTIFICACAO_WHATSAPP_WEBHOOK_URL:}
app.notificacao.whatsapp.webhook-token=${APP_NOTIFICACAO_WHATSAPP_WEBHOOK_TOKEN:}
app.notificacao.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# Object storage (Garage/S3 compativel).
# O endpoint interno e usado pelo backend; o publico assina URLs para o browser.
# ---------------------------------------------------------------------------
app.storage.provider=${APP_STORAGE_PROVIDER:s3}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:3900}
app.storage.public-endpoint=${APP_STORAGE_PUBLIC_ENDPOINT:http://localhost:3900}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:GK00000000000000000000000000000000}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
app.storage.bucket=${APP_STORAGE_BUCKET:crm-originais}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.multipart-threshold-bytes=${APP_STORAGE_MULTIPART_THRESHOLD:5242880}
app.storage.part-size-bytes=${APP_STORAGE_PART_SIZE:8388608}
app.storage.presign-seconds=${APP_STORAGE_PRESIGN_SECONDS:600}
app.storage.presign-download-seconds=${APP_STORAGE_PRESIGN_DOWNLOAD_SECONDS:3600}
app.storage.max-comprovante-bytes=${APP_STORAGE_MAX_COMPROVANTE:10485760}

# Remove publicações concluídas; eventos pendentes continuam no outbox.
spring.modulith.events.completion-mode=delete

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.ranny.fotografia=INFO
