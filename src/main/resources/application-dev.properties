# Perfil de desenvolvimento local.
#
# Credenciais do primeiro admin sao apenas para a maquina do desenvolvedor.
# Em producao use APP_AUTH_BOOTSTRAP_* e remova depois do primeiro acesso.
app.seed.enabled=true
app.auth.bootstrap-enabled=true
app.auth.bootstrap-admin-email=admin@rannyamaral.com.br
app.auth.bootstrap-admin-password=admin12345
app.auth.allow-ephemeral-keys=true
app.auth.issuer=http://localhost:8080
logging.level.com.ranny.fotografia.auth=DEBUG
