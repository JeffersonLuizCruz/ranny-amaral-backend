spring.application.name=fotografia

# ---------------------------------------------------------------------------
# Testes rápidos: H2 em memoria, schema criado pelo Hibernate.
# As migracoes em db/migration sao especificas de PostgreSQL e ficam
# desabilitadas aqui. O schema Postgres e validado pelo PostgresSchemaIT.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fotografia-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.enabled=false
app.seed.enabled=false
app.cors.allowed-origins=http://localhost:5173
spring.modulith.events.completion-mode=delete

logging.level.com.ranny.fotografia=INFO
logging.level.org.hibernate.SQL=WARN
