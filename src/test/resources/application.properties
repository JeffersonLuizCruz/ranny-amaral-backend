spring.application.name=fotografia

# ---------------------------------------------------------------------------
# Testes rápidos: H2 em memoria, schema criado pelo Hibernate.
# As migracoes em db/migration sao especificas de PostgreSQL e ficam
# desabilitadas aqui. O schema Postgres e validado pelo PostgresSchemaIT.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fotografia-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.enabled=false
app.seed.enabled=false
app.cors.allowed-origins=http://localhost:5173
app.galeria.processamento-async=false

# Os specs legados nao enviam User-Agent/Content-Type em todas as chamadas.
# O FiltroBordaSegurancaSpec liga as regras via @TestPropertySource.
app.seguranca.borda.exigir-user-agent=false
app.seguranca.borda.exigir-content-type-em-mutacoes=false
app.seguranca.borda.ip-check-habilitado=false
app.seguranca.borda.max-payload-bytes=20971520
spring.modulith.events.completion-mode=delete

app.storage.provider=memory
app.storage.max-comprovante-bytes=10485760
app.storage.multipart-threshold-bytes=5242880
app.storage.part-size-bytes=8388608
app.storage.presign-seconds=600

# A medicao real de disco e testada com um caminho explicito em ArmazenamentoSpec.
app.armazenamento.volume-path=
app.armazenamento.coleta-habilitada=false
app.armazenamento.reserva-bytes=10737418240
app.armazenamento.percentual-alerta=85

# A suite legada chama controllers administrativos sem JWT. Os specs de auth
# ligam a seguranca explicitamente via @TestPropertySource.
app.security.enabled=false
app.auth.bootstrap-enabled=false
app.auth.allow-ephemeral-keys=true
app.auth.issuer=http://localhost
app.auth.cookie-secure=false

logging.level.com.ranny.fotografia=INFO
logging.level.org.hibernate.SQL=WARN
