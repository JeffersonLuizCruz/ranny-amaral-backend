spring.application.name=fotografia

# Perfil exclusivo do MinioStorageIT: H2 em memoria + MinIO real.
spring.datasource.url=jdbc:h2:mem:fotografia-minio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.seed.enabled=false
spring.modulith.events.completion-mode=delete
app.cors.allowed-origins=http://localhost:5173

app.storage.provider=minio
app.storage.endpoint=${MINIO_TEST_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${MINIO_TEST_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_TEST_ACCESS_KEY:minioadmin}
app.storage.secret-key=${MINIO_TEST_SECRET_KEY:minioadmin}
app.storage.bucket=${MINIO_TEST_BUCKET:crm-test-originais}
app.storage.region=us-east-1
app.storage.multipart-threshold-bytes=5242880
app.storage.part-size-bytes=8388608
app.storage.presign-seconds=600
app.storage.max-comprovante-bytes=10485760
