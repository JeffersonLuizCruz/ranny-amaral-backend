spring.application.name=fotografia

# Perfil usado apenas pelo PostgresSchemaIT/CI: Flyway aplica a migracao e o
# Hibernate valida o schema real do PostgreSQL.
spring.datasource.url=${POSTGRES_TEST_URL:jdbc:postgresql://localhost:5432/photoizer}
spring.datasource.username=${POSTGRES_TEST_USERNAME:photoizer}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:photoizer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.seed.enabled=false
spring.modulith.events.completion-mode=delete
