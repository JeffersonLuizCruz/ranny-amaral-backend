spring.application.name=fotografia

# Perfil exclusivo do S3StorageIT: H2 em memoria + Garage/S3 real.
spring.datasource.url=jdbc:h2:mem:fotografia-s3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.seed.enabled=false
spring.modulith.events.completion-mode=delete
app.cors.allowed-origins=http://localhost:5173

app.storage.provider=s3
app.storage.endpoint=${S3_TEST_ENDPOINT:http://localhost:3900}
app.storage.public-endpoint=${S3_TEST_ENDPOINT:http://localhost:3900}
app.storage.access-key=${S3_TEST_ACCESS_KEY:GK00000000000000000000000000000000}
app.storage.secret-key=${S3_TEST_SECRET_KEY:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
app.storage.bucket=${S3_TEST_BUCKET:crm-originais}
app.storage.region=us-east-1
app.storage.multipart-threshold-bytes=5242880
app.storage.part-size-bytes=8388608
app.storage.presign-seconds=600
app.storage.max-comprovante-bytes=10485760
